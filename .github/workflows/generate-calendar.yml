name: generate-calendar

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: 起始公历年（默认 2026）
        required: false
        default: '2026'
      to_year:
        description: 结束公历年（留空则至少到 2030，之后提前覆盖下一年）
        required: false
        default: ''
  schedule:
    # 每月重生成并提交真实产物，避免仅年度运行导致 60 天无活动停用。
    - cron: '17 0 1 * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'vendor/**'
      - 'tests/**'
      - '.github/workflows/generate-calendar.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Generate calendar
        env:
          FROM_YEAR: ${{ inputs.from_year }}
          TO_YEAR: ${{ inputs.to_year }}
        run: |
          args=()
          if [ -n "$FROM_YEAR" ]; then
            args+=(--from-year "$FROM_YEAR")
          fi
          if [ -n "$TO_YEAR" ]; then
            args+=(--to-year "$TO_YEAR")
          fi
          node scripts/generate.js "${args[@]}"

      - name: Verify generated files
        run: npm run verify

      - name: Commit public/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate calendar"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
